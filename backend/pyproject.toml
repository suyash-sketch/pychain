[project]
name = "backend"
version = "0.1.0"
description = "PyChain blockchain backend"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "cryptography>=50.0.1",
    "fastapi[standard]>=0.141.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
